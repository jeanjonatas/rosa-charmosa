<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067" width="800" height="1067">
  <defs>
    <linearGradient id="bg-ref-005-frente" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F3EC"/>
      <stop offset="100%" stop-color="#E9E3D4"/>
    </linearGradient>
    <linearGradient id="dress-ref-005-frente" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#8F2F3A" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#8F2F3A"/>
      <stop offset="100%" stop-color="#5F1D25"/>
    </linearGradient>
    <radialGradient id="glow-ref-005-frente" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-ref-005-frente" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="1067" fill="url(#bg-ref-005-frente)"/>
  <ellipse cx="400" cy="950" rx="260" ry="28" fill="#1A1A1A" opacity="0.08"/>
  <g transform="translate(0,0)" opacity="1" filter="url(#soft-ref-005-frente)">
    <!-- torso -->
    <path d="M 400 220
             C 450 220, 480 260, 470 320
             L 510 460
             C 560 620, 600 780, 620 940
             L 180 940
             C 200 780, 240 620, 290 460
             L 330 320
             C 320 260, 350 220, 400 220 Z"
          fill="url(#dress-ref-005-frente)"/>
    <!-- bodice shimmer -->
    <path d="M 340 260 C 370 240, 430 240, 460 260 L 450 340 L 350 340 Z"
          fill="url(#glow-ref-005-frente)"/>
    <!-- waist cinch -->
    <path d="M 310 440 Q 400 470 490 440 L 500 460 Q 400 495 300 460 Z"
          fill="#5F1D25" opacity="0.55"/>
    <!-- skirt folds -->
    <path d="M 320 500 Q 310 700 240 940" fill="none" stroke="#5F1D25" stroke-width="2" opacity="0.4"/>
    <path d="M 400 500 Q 400 720 380 940" fill="none" stroke="#5F1D25" stroke-width="2" opacity="0.4"/>
    <path d="M 480 500 Q 490 700 560 940" fill="none" stroke="#5F1D25" stroke-width="2" opacity="0.4"/>
    <!-- straps / neckline detail -->
    <path d="M 350 230 Q 400 210 450 230" fill="none" stroke="#5F1D25" stroke-width="3" opacity="0.6"/>
  </g>
  <!-- paper grain -->
  <rect width="800" height="1067" fill="url(#glow-ref-005-frente)" opacity="0.4"/>
  <!-- label -->
  <g font-family="Georgia, serif" fill="#1A1A1A" opacity="0.55">
    <text x="60" y="1010" font-size="18" letter-spacing="4">ROSA CHARMOSA</text>
    <text x="60" y="1035" font-size="12" letter-spacing="2" opacity="0.7">REF-005 · MARSALA</text>
  </g>
  <g font-family="Georgia, serif" fill="#1A1A1A" opacity="0.4">
    <text x="740" y="1035" font-size="11" letter-spacing="2" text-anchor="end">MOCKUP</text>
  </g>
</svg>